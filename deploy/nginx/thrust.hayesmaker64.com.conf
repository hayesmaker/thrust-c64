# nginx site for the Thrust level editor. provision.sh copies it to
# /etc/nginx/sites-available/; certbot then adds the HTTPS part to that copy.
# Static files come straight from dist/; only /api/ goes to the Node server (pm2).

# at most 10 builds a minute per address (burst 5): each runs KickAssembler
limit_req_zone $binary_remote_addr zone=thrust_build:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name thrust.hayesmaker64.com;

    root /srv/thrust-c64/packages/level-editor/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        # file names carry a content hash
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /c64/ {
        # the emulator (older nginx mime.types lack wasm)
        types { application/wasm wasm; text/javascript js; }
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /api/build {
        limit_req zone=thrust_build burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:5180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # builds queue one at a time, each stopped after 30 s
        proxy_read_timeout 300s;
    }

    # the editor shows the "error" text
    error_page 429 = @too_many_builds;
    location @too_many_builds {
        default_type application/json;
        return 429 '{"error":"too many builds from your address: wait a minute and try again"}';
    }
}
