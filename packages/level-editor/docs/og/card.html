<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #15151c; color: #e8e8f0; font-family: "Noto Sans", "DejaVu Sans", sans-serif; display: flex; }
  .text { width: 520px; padding: 64px 0 56px 64px; box-sizing: border-box; display: flex; flex-direction: column; }
  .badge { align-self: flex-start; background: #7869c4; color: #fff; font-weight: 700; font-size: 20px; letter-spacing: 1px; padding: 8px 16px; border-radius: 6px; }
  h1 { font-size: 64px; line-height: 1.02; margin: 28px 0 0; letter-spacing: -1px; }
  h1 span { color: #a99cf0; }
  p { font-size: 25px; line-height: 1.4; color: #b8b8c8; margin: 24px 0 0; }
  .url { margin-top: auto; font-family: "DejaVu Sans Mono", monospace; font-size: 22px; color: #e8e8f0; }
  .url b { color: #a99cf0; font-weight: normal; }
  .shot { flex: 1; position: relative; overflow: hidden; }
  .shot img { position: absolute; left: 0; top: 40px; width: 1050px; border-radius: 10px 0 0 10px; box-shadow: 0 0 0 2px #2c2c3a, 0 20px 60px rgba(0,0,0,.6); object-fit: cover; object-position: 0 0; height: 640px; }
</style></head><body>
  <div class="text">
    <div class="badge">C64 THRUST · 40 YEARS · 1986–2026</div>
    <h1>Thrust<br><span>level editor</span></h1>
    <p>Draw your own caves, place the pod, fuel and guns, then play your levels in a C64 emulator, right in the browser.</p>
    <div class="url"><b>›</b> thrust.hayesmaker64.com</div>
  </div>
  <div class="shot"><img src="../img/overview.png"></div>
</body></html>
